name: Leituras da Paulus

# Toda segunda-feira às 06:00 (Brasília) busca as leituras novas e grava em public/data/leituras.
# O agendamento só vale para a branch padrão (main). Também pode ser disparado à mão.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Data inicial (AAAA-MM-DD). Vazio = últimos 35 dias.'
        required: false

permissions:
  contents: write
  actions: write # para acionar a publicação do site

concurrency:
  group: leituras
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Testes do extrator
        run: pnpm exec vitest run scripts

      - name: Coletar leituras
        run: |
          if [ -n "${{ inputs.desde }}" ]; then
            pnpm leituras --desde "${{ inputs.desde }}"
          else
            pnpm leituras
          fi

      # Confere as regras do calendário com os dados novos. Se falhar, os dados
      # são gravados mesmo assim, mas o aviso fica visível no GitHub Actions.
      - name: Conferir regras do calendário com a Paulus
        run: pnpm exec vitest run src/liturgia
        continue-on-error: true

      - name: Gravar no repositório
        id: gravar
        run: |
          git config user.name "robo-das-leituras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/leituras
          if git diff --cached --quiet; then
            echo "Nada novo."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Leituras: atualização automática"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      # Commits feitos pelo GITHUB_TOKEN não disparam outros workflows;
      # por isso a publicação é acionada aqui.
      - name: Publicar o site
        if: steps.gravar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref "${{ github.ref_name }}"
